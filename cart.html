<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>Cart - Eternal Nutricare</title>
  
  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <!-- Google Fonts: Plus Jakarta Sans & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Layout Styles -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/storefront.css">
  <link rel="stylesheet" href="styles/auth.css">

  <style>
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #FAFBF9;
      font-family: 'DM Sans', 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Plain Clean Header with Go Back Navigation */
    .plain-sub-header {
      position: sticky;
      top: 0;
      width: 100%;
      background: #FFFFFF;
      border-bottom: 1px solid #F0F2EC;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
    }

    .sub-back-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #1E2519;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      text-decoration: none;
      border-radius: 50%;
      margin-left: -8px;
    }

    .sub-page-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #1E2519;
      text-align: center;
    }

    .sub-header-spacer {
      width: 40px;
    }

    /* Page Container (Full Screen Responsive) */
    .cart-screen-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 16px 110px;
    }

    @media (min-width: 900px) {
      .cart-screen-container {
        max-width: 1000px;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 28px;
        align-items: start;
        padding-top: 24px;
      }
    }

    /* Free Shipping Progress Card */
    .free-shipping-card {
      background: #F8F5F0;
      border: 1px solid #ECE7DF;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      grid-column: 1 / -1;
    }

    .free-shipping-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #281612;
      margin-bottom: 8px;
    }

    .free-shipping-track {
      height: 6px;
      background: #EAE3D9;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .free-shipping-fill {
      height: 100%;
      background: #553518;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .free-shipping-sub {
      font-size: 12px;
      color: #7A6965;
    }

    /* Cart Item Card (Reference Style) */
    .cart-product-card {
      background: #FFFFFF;
      border: 1px solid #ECE7DF;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      gap: 14px;
      position: relative;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(40, 22, 18, 0.04);
    }

    .cart-thumb-box {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
      background: #F8F5F0;
      border: 1px solid #ECE7DF;
      flex-shrink: 0;
    }

    .cart-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-product-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cart-product-title {
      font-family: 'Noto Serif', Georgia, serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 700;
      color: #1E1A17;
      padding-right: 28px;
      line-height: 1.25;
    }

    .cart-product-unit {
      font-size: 12px;
      color: #7A6965;
      margin-top: 2px;
    }

    .cart-product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .cart-product-price {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #1E1A17;
    }

    .cart-delete-icon-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #7A6965;
      font-size: 19px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-delete-icon-btn:hover {
      color: #DC2626;
      background: #FEE2E2;
      transform: scale(1.08);
    }

    /* Stepper Pill in Brown Color (Exact Reference) */
    .cart-pill-stepper {
      display: flex;
      align-items: center;
      background: #281612;
      border-radius: 999px;
      padding: 3px 8px;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(40, 22, 18, 0.22);
    }

    .pill-step-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      border-radius: 50%;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .pill-step-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .pill-step-btn:active {
      transform: scale(0.88);
    }

    .pill-step-count {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: #FFFFFF;
      min-width: 16px;
      text-align: center;
    }

    /* Order Summary Card */
    .order-summary-card {
      background: #FFFFFF;
      border: 1px solid #ECE7DF;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(40, 22, 18, 0.04);
      margin-top: 6px;
    }

    .summary-card-title {
      font-size: 16px;
      font-weight: 800;
      color: #1E1A17;
      margin-bottom: 16px;
    }

    .summary-line-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #554844;
      margin-bottom: 10px;
    }

    .eco-discount-text {
      color: #553518;
      font-weight: 700;
    }

    .summary-divider {
      height: 1px;
      background: #ECE7DF;
      margin: 14px 0;
    }

    .summary-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      color: #1E1A17;
    }

    /* Checkout & Continue Shopping Buttons */
    .btn-green-proceed {
      width: 100%;
      background: #281612;
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      box-shadow: 0 4px 14px rgba(40, 22, 18, 0.25);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-green-proceed:hover {
      background: #3E241E;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(40, 22, 18, 0.35);
    }

    .btn-continue-shopping-link {
      display: block;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #553518;
      text-decoration: none;
      margin-top: 14px;
      cursor: pointer;
    }

    .btn-continue-shopping-link:hover {
      color: #281612;
    }
  </style>
</head>
<body>

  <!-- Plain Clean Header with Go Back Navigation (100% Width) -->
  <header class="plain-sub-header">
    <a href="index.html" class="sub-back-btn" aria-label="Go Back">
      <i class="ri-arrow-left-line"></i>
    </a>
    <h1 class="sub-page-title">Cart</h1>
    <div class="sub-header-spacer"></div>
  </header>

  <!-- Main Cart Container -->
  <main class="cart-screen-container">
    
    <!-- Free Shipping Progress -->
    <div class="free-shipping-card">
      <div class="free-shipping-title" id="free-ship-title">Add items to unlock Free Shipping!</div>
      <div class="free-shipping-track">
        <div class="free-shipping-fill" id="free-ship-bar" style="width: 0%;"></div>
      </div>
      <div class="free-shipping-sub" id="free-ship-subtext">Free shipping on orders above ₹999</div>
    </div>

    <!-- Left: Cart Items List -->
    <div id="cart-products-list"></div>

    <!-- Right: Order Summary -->
    <div class="order-summary-card">
      <h2 class="summary-card-title">Order Summary</h2>

      <div class="summary-line-row">
        <span>Subtotal</span>
        <span id="sum-subtotal">₹0</span>
      </div>

      <div class="summary-line-row">
        <span>Delivery Charge</span>
        <span id="sum-delivery">₹40</span>
      </div>

      <div class="summary-line-row eco-discount-text">
        <span>🌱 Eco-Packaging Discount</span>
        <span id="sum-eco-discount">-₹20</span>
      </div>

      <div class="summary-divider"></div>

      <div class="summary-total-row">
        <span>Total</span>
        <span id="sum-grand-total">₹0</span>
      </div>

      <!-- Action Buttons -->
      <a href="checkout.html" class="btn-green-proceed">
        <span>Proceed to Checkout</span>
        <i class="ri-arrow-right-line"></i>
      </a>

      <a href="categories.html" class="btn-continue-shopping-link">
        Continue Shopping
      </a>

    </div>

  </main>

  <!-- Mobile Bottom Dock (4 Core Icons) -->
  <nav class="mobile-bottom-dock">
    <a href="index.html" class="dock-item" aria-label="Home">
      <i class="ri-home-5-line"></i>
      <span>Home</span>
    </a>
    <a href="categories.html" class="dock-item" aria-label="Categories">
      <i class="ri-apps-2-line"></i>
      <span>Categories</span>
    </a>
    <a href="cart.html" class="dock-item active" aria-label="Cart">
      <div class="dock-badge-wrap">
        <i class="ri-shopping-cart-2-fill"></i>
        <span class="dock-badge-pill minimal-cart-badge" style="display: none;">0</span>
      </div>
      <span>Cart</span>
    </a>
    <a href="account.html" class="dock-item" aria-label="Account">
      <i class="ri-user-3-line"></i>
      <span>Account</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/store.config.js"></script>
  <script src="core/cloud-db.js"></script>
  <script src="core/payment-verifier.js"></script>
  <script src="core/auth-engine.js"></script>
  <script>
    const DEFAULT_CATALOG = {
      'prod_1': { title: 'Organic Honey', unit: '500g Glass Jar', price: 499, image: 'assets/prod_honey_studio.jpg' },
      'prod_2': { title: 'Handmade Lemon Pickle', unit: '300g Eco Pack', price: 249, image: 'assets/prod_pickle_studio.jpg' },
      'prod_3': { title: 'Millet Breakfast Rava', unit: '500g Eco Pack', price: 189, image: 'assets/prod_rava_studio.jpg' },
      'prod_4': { title: 'Millet Biscuits', unit: '200g Fresh Pack', price: 149, image: 'assets/prod_cookie_studio.jpg' },
      'prod_5': { title: "Dates Laddu's", unit: '250g Box', price: 349, image: 'assets/prod_laddu_studio.jpg' },
      'prod_6': { title: 'Moringa Chikki', unit: '150g Bar', price: 129, image: 'assets/prod_chikki_studio.jpg' }
    };

    let cartList = [];
    let storeSettings = {
      freeShippingThreshold: 999,
      standardShippingFee: 40,
      minOrderValue: 999
    };

    async function loadCartData() {
      try {
        const saved = localStorage.getItem('em_cart_items');
        if (saved) {
          cartList = JSON.parse(saved);
        }
      } catch (e) {
        cartList = [];
      }
      if (!Array.isArray(cartList)) cartList = [];

      // Filter out invalid/orphaned items with missing details or zero price
      cartList = cartList.filter(item => item && item.id && (Number(item.price) > 0 || (DEFAULT_CATALOG[item.id] && DEFAULT_CATALOG[item.id].price > 0)));
      saveCartData();

      // Hydrate live shipping settings from Supabase
      if (window.CloudDB && window.CloudDB.isSupabaseActive()) {
        try {
          const settings = await window.CloudDB.getStoreSettings();
          if (settings && Object.keys(settings).length > 0) {
            storeSettings.freeShippingThreshold = Number(settings.free_shipping_threshold ?? storeSettings.freeShippingThreshold);
            storeSettings.standardShippingFee = Number(settings.standard_shipping_fee ?? storeSettings.standardShippingFee);
            storeSettings.minOrderValue = Number(settings.min_order_value ?? storeSettings.minOrderValue);
          }
        } catch(e) {
          console.warn('Store settings sync notice:', e);
        }
      }

      const subEl = document.getElementById('free-ship-subtext');
      if (subEl) {
        subEl.textContent = `Free shipping on orders above ₹${storeSettings.freeShippingThreshold.toLocaleString('en-IN')}`;
      }

      renderCartView();
    }

    function saveCartData() {
      try {
        localStorage.setItem('em_cart_items', JSON.stringify(cartList));
      } catch(e) {}
    }

    function renderCartView() {
      const container = document.getElementById('cart-products-list');
      if (cartList.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 48px 16px; background: #FFFFFF; border-radius: 18px; border: 1px solid #ECE7DF;">
            <i class="ri-shopping-bag-3-line" style="font-size: 48px; color: #D6CAB8; margin-bottom: 12px; display: block;"></i>
            <h3 style="font-size: 16px; font-weight: 800; color: #1E1A17; margin-bottom: 6px;">Your cart is empty</h3>
            <p style="font-size: 13px; color: #7A6965; margin-bottom: 18px;">Add some farm-fresh organic essentials.</p>
            <a href="categories.html" class="btn-green-proceed" style="max-width: 220px; margin: 0 auto; padding: 11px 20px; font-size: 13px;">Browse Products</a>
          </div>
        `;
        recalculateSummary();
        return;
      }

      container.innerHTML = cartList.map(item => {
        const cat = DEFAULT_CATALOG[item.id] || {};
        const title = item.title || cat.title || 'Organic Product';
        const unit = item.unit || cat.unit || 'Standard Pack';
        const img = item.image || cat.image || 'assets/prod_honey_studio.jpg';
        const price = Number(item.price) || cat.price || 0;

        return `
          <div class="cart-product-card" id="card-item-${item.id}">
            <div class="cart-thumb-box">
              <img src="${img}" alt="${title}" loading="lazy">
            </div>
            <div class="cart-product-details">
              <div>
                <div class="cart-product-title">${title}</div>
                <div class="cart-product-unit">${unit}</div>
              </div>
              <div class="cart-product-bottom">
                <div class="cart-product-price">₹${price}</div>
                <div class="cart-pill-stepper">
                  <button class="pill-step-btn" onclick="updateItemQty('${item.id}', -1)" aria-label="Decrease">−</button>
                  <span class="pill-step-count" id="count-${item.id}">${item.qty}</span>
                  <button class="pill-step-btn" onclick="updateItemQty('${item.id}', 1)" aria-label="Increase">+</button>
                </div>
              </div>
            </div>
            <button class="cart-delete-icon-btn" onclick="removeItem('${item.id}')" aria-label="Remove item">
              <i class="ri-delete-bin-line"></i>
            </button>
          </div>
        `;
      }).join('');

      recalculateSummary();
    }

    function updateItemQty(id, delta) {
      const item = cartList.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        removeItem(id);
      } else {
        saveCartData();
        renderCartView();
      }
    }

    function removeItem(id) {
      cartList = cartList.filter(i => i.id !== id);
      saveCartData();
      renderCartView();
    }

    function recalculateSummary() {
      let subtotal = 0;
      cartList.forEach(item => {
        const cat = DEFAULT_CATALOG[item.id] || {};
        const price = Number(item.price) || cat.price || 0;
        subtotal += (price * (Number(item.qty) || 1));
      });

      const freeThreshold = Number(storeSettings.freeShippingThreshold) || 999;
      const isFree = subtotal >= freeThreshold;
      const deliveryFee = (subtotal === 0 || isFree) ? 0 : (Number(storeSettings.standardShippingFee) || 40);
      const ecoDiscount = subtotal > 0 ? 20 : 0;
      const total = Math.max(0, subtotal + deliveryFee - ecoDiscount);

      const fill = document.getElementById('free-ship-bar');
      const title = document.getElementById('free-ship-title');
      const subEl = document.getElementById('free-ship-subtext');

      if (subEl) {
        subEl.textContent = `Free shipping on orders above ₹${freeThreshold.toLocaleString('en-IN')}`;
      }

      if (title && fill) {
        if (subtotal === 0) {
          title.innerHTML = `Add items to unlock Free Shipping!`;
          fill.style.width = '0%';
        } else if (isFree) {
          title.innerHTML = `🎉 <strong>Congratulations!</strong> You unlocked Free Shipping!`;
          fill.style.width = '100%';
        } else {
          const needed = freeThreshold - subtotal;
          title.innerHTML = `Add <strong>₹${needed.toLocaleString('en-IN')}</strong> more for Free Shipping!`;
          fill.style.width = `${Math.min(100, Math.round((subtotal / freeThreshold) * 100))}%`;
        }
      }

      document.getElementById('sum-subtotal').textContent = `₹${subtotal}`;
      document.getElementById('sum-delivery').textContent = deliveryFee === 0 ? 'FREE' : `₹${deliveryFee}`;
      document.getElementById('sum-grand-total').textContent = `₹${total}`;
    }

    window.addEventListener('DOMContentLoaded', loadCartData);
  </script>
</body>
</html>
